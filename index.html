<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PRO Deriv Bot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">

  <h1>⚙ PRO DERIV BOT</h1>
  <div id="modeIndicator" class="mode-indicator demo">JESAN 💲 MODE - DEMO</div>

  <!-- ── LOGIN SCREEN ── -->
  <div id="loginScreen">
    <div class="login-box">
      <p class="login-desc">Sign in with your Deriv account to start trading.</p>

      <!-- Plain link — no JavaScript needed to redirect -->
      <a
        href="https://oauth.deriv.com/oauth2/authorize?app_id=33wZZKTFZrmsZgFaAH53Z&l=EN&brand=deriv"
        class="login-btn"
      >🔐 Login with Deriv</a>

      <p class="login-note">
        You will be redirected to Deriv's secure login page and brought back here automatically.
      </p>
    </div>
  </div>

  <!-- ── BOT SCREEN (shown after login) ── -->
  <div id="botScreen" style="display:none;">

    <!-- Account info bar -->
    <div class="account-bar">
      <div class="account-info">
        <span class="account-label">Account</span>
        <span id="accountDisplay">—</span>
      </div>
      <div class="account-info">
        <span class="account-label">Type</span>
        <span id="accountType">—</span>
      </div>
      <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>

    <!-- Account selector (shown when user has multiple accounts) -->
    <div id="accountSelectorWrap" style="display:none;" class="inputs">
      <label>Select Account</label>
      <select id="accountSelector" class="account-select"></select>
    </div>

    <!-- Demo / Live toggle -->
    <div class="row">
      <button id="demoBtn" class="active">Demo</button>
      <button id="liveBtn">Live</button>
    </div>

    <!-- Control buttons -->
    <div class="buttons">
      <button id="start">Start</button>
      <button id="pause">Pause</button>
      <button id="stop">Stop</button>
      <button id="reset">Reset</button>
    </div>

    <!-- Stake input -->
    <div class="inputs">
      <label>Stake ($)</label>
      <input id="stakeInput" type="number" value="0.35" step="0.01" min="0.35" />
    </div>

    <!-- Stats -->
    <div class="stats">
      <div>Price: <span id="price">-</span></div>
      <div>Last Digit: <span id="lastDigit">-</span></div>
      <div>Balance: <span id="balance">-</span></div>
      <div>Level: <span id="level">0</span></div>
      <div>Profit: <span id="profit">0.00</span></div>
    </div>

    <!-- Log -->
    <div id="log" class="log"></div>

  </div><!-- /botScreen -->

</div><!-- /container -->

<script src="app.js"></script>
</body>
  </html>
