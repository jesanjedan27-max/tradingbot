<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deriv Bot FIXED WS</title>
</head>

<body style="background:#020617;color:white;font-family:Arial">

<h2>DERIV FIXED WEBSOCKET BOT</h2>

<button id="start">START</button>
<button id="stop">STOP</button>

<div id="status">STOPPED</div>
<div id="balance">--</div>
<div id="price">--</div>
<div id="log"></div>

<script>
document.addEventListener("DOMContentLoaded", () => {

const APP_ID = "1089";
const SYMBOL = "R_100";

let ws = null;
let token = "";
let running = false;

let digits = [];
let contractId = null;
let tradeLock = false;
let awaitingProposal = false;

const logEl = document.getElementById("log");
const statusEl = document.getElementById("status");
const balanceEl = document.getElementById("balance");
const priceEl = document.getElementById("price");

function log(m){
logEl.innerHTML += "<br>" + m;
logEl.scrollTop = logEl.scrollHeight;
}

function send(d){
if(ws && ws.readyState === 1){
ws.send(JSON.stringify(d));
}
}

/* SAFE DIGIT */
function lastDigit(p){
return Number(Number(p).toFixed(2).slice(-1));
}

/* CONNECT */
function connect(){

ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);

ws.onopen = () => {
log("CONNECTED");
send({ authorize: token });
};

ws.onerror = () => {
log("WS ERROR");
statusEl.textContent = "ERROR";
};

ws.onclose = () => {
log("DISCONNECTED");
statusEl.textContent = "STOPPED";
};

ws.onmessage = (e) => {

let msg;
try {
msg = JSON.parse(e.data);
} catch(err){
log("BAD JSON");
return;
}

if(msg.error){
log("ERROR: " + msg.error.message);
return;
}

/* AUTH */
if(msg.msg_type === "authorize"){
log("AUTHORIZED");
statusEl.textContent = "RUNNING";

send({ balance: 1, subscribe: 1 });
send({ ticks: SYMBOL, subscribe: 1 });
}

/* BALANCE */
if(msg.msg_type === "balance"){
balanceEl.textContent = Number(msg.balance.balance).toFixed(2);
}

/* TICK */
if(msg.msg_type === "tick"){

const price = msg.tick.quote;
priceEl.textContent = price.toFixed(2);

const d = lastDigit(price);

digits.push(d);
if(digits.length > 3) digits.shift();

/* SIMPLE PATTERN */
if(
digits.length === 3 &&
digits[0] === digits[1] &&
digits[1] === digits[2] &&
!tradeLock &&
running
){
placeTrade(d);
}

}

/* PROPOSAL RESPONSE (FIXED FLOW) */
if(msg.msg_type === "proposal"){

if(!awaitingProposal) return;

const id = msg.proposal.id;

log("PROPOSAL READY");

send({
buy: id,
price: 0.35
});

awaitingProposal = false;
}

/* BUY */
if(msg.msg_type === "buy"){

if(!msg.buy || !msg.buy.contract_id){
log("BUY FAILED");
tradeLock = false;
return;
}

contractId = msg.buy.contract_id;
tradeLock = true;

log("BUY OK: " + contractId);

send({
proposal_open_contract: 1,
contract_id: contractId,
subscribe: 1
});
}

/* RESULT */
if(msg.msg_type === "proposal_open_contract"){

const c = msg.proposal_open_contract;

if(!c || c.contract_id !== contractId) return;

if(c.is_sold){

log("RESULT: " + c.profit);

tradeLock = false;
contractId = null;
}

}

};

}

/* PLACE TRADE (FIXED PROPER FLOW) */
function placeTrade(barrier){

if(!ws || tradeLock || awaitingProposal) return;

awaitingProposal = true;

log("REQUEST PROPOSAL");

send({
proposal: 1,
amount: 0.35,
basis: "stake",
contract_type: "DIGITDIFF",
currency: "USD",
duration: 1,
duration_unit: "t",
symbol: SYMBOL,
barrier: barrier
});

}

document.getElementById("start").onclick = () => {

token = prompt("Enter Deriv Token");

if(!token){
alert("No token");
return;
}

running = true;
connect();

};

document.getElementById("stop").onclick = () => {
running = false;
ws?.close();
log("STOPPED");
};

});
</script>

</body>
  </html>
