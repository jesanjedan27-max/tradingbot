<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PRO Deriv Bot</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>PRO DERIV BOT</h1>

  <!-- MODE (optional UI only) -->
  <div class="row">
    <button id="demoBtn">Demo</button>
    <button id="liveBtn">Live</button>
  </div>

  <!-- OAUTH LOGIN -->
  <button id="login" class="login-btn">Login with Deriv</button>

  <!-- CONTROL BUTTONS -->
  <div class="buttons">
    <button id="start">Start</button>
    <button id="pause">Pause</button>
    <button id="stop">Stop</button>
    <button id="reset">Reset</button>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div>Price: <span id="price">-</span></div>
    <div>Balance: <span id="balance">-</span></div>
    <div>Level: <span id="level">0</span></div>
  </div>

  <!-- hidden token storage -->
  <input type="hidden" id="token" />

  <!-- LOGS -->
  <div id="log" class="log"></div>

</div>

<script src="app.js"></script>

</body>
</html>
