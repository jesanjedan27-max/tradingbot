<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deriv DigitDiff Stable Bot</title>

<style>
body{background:#020617;color:#fff;font-family:Arial}
.container{max-width:520px;margin:20px auto;padding:20px;background:#0f172a;border-radius:12px}
h2{text-align:center;color:#38bdf8}

input{width:100%;padding:10px;margin:6px 0;border:none;border-radius:6px}

.stats{font-size:14px;margin-top:10px}
.stats span{color:#22c55e;font-weight:bold}

.buttons{display:flex;gap:6px;margin-top:10px}
button{flex:1;padding:10px;border:none;border-radius:6px;font-weight:bold;cursor:pointer}
#start{background:#22c55e}
#pause{background:#facc15}
#stop{background:#ef4444}
#reset{background:#60a5fa}

#log{height:260px;overflow:auto;background:#111827;padding:8px;border-radius:6px;font-size:12px;margin-top:10px}
</style>
</head>

<body>

<div class="container">

<h2>DERIV DIGIT BOT (STABLE)</h2>

<input id="token" type="password" placeholder="Enter Deriv API Token">

<div class="stats">
Balance: <span id="balance">--</span><br>
Price: <span id="price">--</span><br>
Profit: <span id="profit">0.00</span><br>
Status: <span id="status">STOPPED</span>
</div>

<div class="buttons">
<button id="start">START</button>
<button id="pause">PAUSE</button>
<button id="stop">STOP</button>
<button id="reset">RESET</button>
</div>

<div id="log"></div>

</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

const $=id=>document.getElementById(id);

const logEl=$("log");
const priceEl=$("price");
const balanceEl=$("balance");
const profitEl=$("profit");
const statusEl=$("status");

const APP_ID="1089";
const SYMBOL="R_100";

/* STATE */
let ws;
let token;
let running=false;
let paused=false;

let digits=[];
let warmup=0;
let active=false;

let tradeLock=false;
let ladder=1;
let profit=0;

/* LOG */
function log(msg){
console.log(msg);
logEl.innerHTML+="<br>"+msg;
logEl.scrollTop=logEl.scrollHeight;
}

/* SEND */
function send(data){
if(ws && ws.readyState===1){
ws.send(JSON.stringify(data));
}
}

/* DIGIT */
function lastDigit(price){
const s=price.toFixed(2);
return Number(s[s.length-1]);
}

/* STAKE */
function stake(){
if(ladder===1) return 0.35;
if(ladder===2) return 4.05;
return 46.8;
}

/* TRADE */
function trade(barrier){

if(!running||paused||tradeLock) return;

tradeLock=true;

const amount=stake();

log("TRADE → "+barrier+" | $"+amount);

send({
buy:1,
price:amount,
parameters:{
amount,
basis:"stake",
contract_type:"DIGITDIFF",
currency:"USD",
duration:1,
duration_unit:"t",
symbol:SYMBOL,
barrier
}
});
}

/* CONNECT */
function connect(){

log("CONNECTING...");

ws=new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);

ws.onopen=()=>{
log("CONNECTED");
statusEl.textContent="CONNECTED";
send({authorize:token});
log("AUTH SENT");
};

ws.onerror=()=>log("WS ERROR");

ws.onclose=()=>log("DISCONNECTED");

ws.onmessage=(e)=>{

const msg=JSON.parse(e.data);

/* AUTH */
if(msg.msg_type==="authorize"){
log("AUTHORIZED");
statusEl.textContent="AUTHORIZED";

send({ticks:SYMBOL,subscribe:1});
send({balance:1,subscribe:1});
}

/* BALANCE */
if(msg.msg_type==="balance"){
balanceEl.textContent=Number(msg.balance.balance).toFixed(2);
}

/* TICK */
if(msg.msg_type==="tick"){

const price=msg.tick.quote;
const d=lastDigit(price);

priceEl.textContent=price.toFixed(2)+" → "+d;

log("TICK "+d);

/* warmup */
if(!active){
warmup++;
if(warmup>=10){
active=true;
statusEl.textContent="RUNNING";
log("BOT ACTIVE");
}
return;
}

/* digit array */
digits.push(d);
if(digits.length>3) digits.shift();

/* pattern */
if(digits.length===3){

if(digits[0]===digits[1]&&digits[1]===digits[2]&&!tradeLock){
trade(digits[2]);
}

}

}

/* RESULT */
if(msg.msg_type==="proposal_open_contract"){

const c=msg.proposal_open_contract;

if(c.is_sold){
const pnl=Number(c.profit);

profit+=pnl;
profitEl.textContent=profit.toFixed(2);

log("RESULT → "+pnl);

if(pnl>0) ladder=1;
else ladder=Math.min(ladder+1,3);

tradeLock=false;
}

}

};

}

/* BUTTONS */

$("start").onclick=()=>{

token=$("token").value.trim();
if(!token) return alert("Enter token");

running=true;
connect();

};

$("pause").onclick=()=>{
paused=!paused;
log(paused?"PAUSED":"RESUMED");
};

$("stop").onclick=()=>{
running=false;
ws?.close();
statusEl.textContent="STOPPED";
log("STOPPED");
};

$("reset").onclick=()=>{
location.reload();
};

});
</script>

</body>
           </html>
