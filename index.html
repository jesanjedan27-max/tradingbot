<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PRO Deriv Bot</title>
  <style>
    body{font-family:Arial;background:#071126;color:#e6eef8}
    .container{max-width:900px;margin:24px auto;padding:18px;background:#0f1724;border-radius:10px}
    .row{display:flex;gap:8px;margin-bottom:8px}
    button{padding:8px 12px;border-radius:6px;border:none;background:#2563eb;color:white;cursor:pointer}
    .buttons{display:flex;gap:8px;margin:12px 0}
    .inputs{margin:12px 0}
    .stats{display:flex;gap:12px;flex-wrap:wrap}
    .log{height:360px;overflow:auto;background:#071026;padding:10px;border-radius:6px;border:1px solid #123}
    input[type=number]{padding:8px;border-radius:6px;border:1px solid #234;}
  </style>
</head>
<body>

<div class="container">

  <h1 id="modeIndicator">JESAN 💲 MODE - DEMO</h1>

  <div class="row">
    <button id="demoBtn">Demo</button>
    <button id="liveBtn">Live</button>
  </div>

  <div class="buttons">
    <button id="start">Start</button>
    <button id="pause">Pause</button>
    <button id="stop">Stop</button>
    <button id="reset">Reset</button>
  </div>

  <div class="inputs">
    <label>Stake</label>
    <input id="stakeInput" type="number" value="0.35" step="0.01"/>
  </div>

  <div class="stats">
    <div>Price: <span id="price">-</span></div>
    <div>Balance: <span id="balance">-</span></div>
    <div>Level: <span id="level">0</span></div>
    <div>Profit: <span id="profit">0.00</span></div>
  </div>

  <div id="log" class="log"></div>

</div>

<script src="app.js"></script>

</body>
</html>
