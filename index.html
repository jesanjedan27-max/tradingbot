<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deriv Trading Bot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Deriv Trading Bot</h1>

    <div class="account-bar">
      <div class="account-info">
        <span class="account-label">Account</span>
        <span id="accountDisplay" class="account-value">Not logged in</span>
      </div>
      <div class="account-info">
        <span class="account-label">Type</span>
        <span id="accountType" class="account-value">-</span>
      </div>
      <button id="login" class="login-btn">Login</button>
      <button id="logout" class="logout-btn" style="display:none;">Logout</button>
    </div>

    <div class="control-row">
      <button id="start" disabled>START</button>
      <button id="pause" disabled>PAUSE</button>
      <button id="stop" disabled>STOP</button>
      <button id="reset" disabled>RESET</button>
    </div>

    <div class="mode-row">
      <button id="demoBtn" class="mode-btn active">Demo</button>
      <button id="liveBtn" class="mode-btn">Live</button>
    </div>

    <div class="stats">
      <div>
        <span class="status-label">Status</span>
        <span id="status" class="value">Logged out</span>
      </div>
      <div>
        <span class="balance-label">Balance</span>
        <span id="balance" class="value">--</span>
      </div>
      <div>
        <span class="price-label">Price</span>
        <span id="price" class="value">--</span>
      </div>
    </div>

    <div id="log" class="log"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
