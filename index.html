<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deriv Trading Bot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Deriv Trading Bot</h1>

    <div class="account-bar">
      <div class="account-info">
        <span class="account-label">Account</span>
        <span id="accountDisplay">Not logged in</span>
      </div>
      <div class="account-info">
        <span class="account-label">Type</span>
        <span id="accountType">-</span>
      </div>
      <button id="login" class="login-btn">Login</button>
      <button id="logout" class="logout-btn" style="display:none;">Logout</button>
    </div>

    <div class="row">
      <button id="start" disabled>Start</button>
      <button id="pause" disabled>Pause</button>
      <button id="stop" disabled>Stop</button>
      <button id="reset" disabled>Reset</button>
    </div>

    <div class="stats">
      <div>Status: <span id="status">Logged out</span></div>
      <div>Balance: <span id="balance">--</span></div>
      <div>Price: <span id="price">--</span></div>
    </div>

    <div id="log" class="log"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
