<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PRO Deriv Bot</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1 id="modeIndicator" class="mode-indicator demo">DEMO MODE</h1>

  <div class="row">
    <button id="demoBtn">Demo</button>
    <button id="liveBtn">Live</button>
  </div>

  <button id="login">Login with Deriv</button>

  <div class="buttons">
    <button id="start">Start</button>
    <button id="pause">Pause</button>
    <button id="stop">Stop</button>
    <button id="reset">Reset</button>
  </div>

  <div class="inputs">
    <label>Stake</label>
    <input id="stakeInput" type="number" value="0.35" step="0.01"/>
  </div>

  <div class="stats">
    <div>Price: <span id="price">-</span></div>
    <div>Balance: <span id="balance">-</span></div>
    <div>Level: <span id="level">0</span></div>
    <div>Profit: <span id="profit">0.00</span></div>
  </div>

  <div id="log"></div>

</div>

<script src="app.js"></script>

</body>
</html>
