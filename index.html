<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deriv Dual Balance Bot</title>

<style>
body{background:#020617;color:#fff;font-family:Arial}
.container{max-width:520px;margin:20px auto;padding:20px;background:#0f172a;border-radius:12px}

h2{text-align:center;color:#38bdf8}

input{width:100%;padding:10px;margin:6px 0;border:none;border-radius:6px}

.mode{display:flex;gap:6px;margin-bottom:10px}
.mode button{flex:1;padding:10px;border:none;border-radius:6px;font-weight:bold;cursor:pointer}

#demo{background:#22c55e}
#real{background:#ef4444}
.active{outline:3px solid #38bdf8}

.stats{font-size:14px;margin-top:10px}
.stats span{color:#22c55e;font-weight:bold}

.buttons{display:flex;gap:6px;margin-top:10px}
button{flex:1;padding:10px;border:none;border-radius:6px;font-weight:bold}

#start{background:#60a5fa}
#pause{background:#facc15}
#stop{background:#ef4444}
#reset{background:#22c55e}

#log{
height:240px;
overflow:auto;
background:#111827;
padding:8px;
border-radius:6px;
font-size:12px;
margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h2>DERIV DUAL ACCOUNT SYSTEM</h2>

<input id="demoToken" type="password" placeholder="Demo Token (DOT92927394)">
<input id="realToken" type="password" placeholder="Real Token (ROT91650098)">

<div class="mode">
<button id="demo" class="active">DEMO</button>
<button id="real">REAL</button>
</div>

<div class="stats">
Mode: <span id="mode">DEMO</span><br>
Balance: <span id="balance">--</span><br>
Price: <span id="price">--</span><br>
Profit: <span id="profit">0.00</span><br>
Status: <span id="status">STOPPED</span>
</div>

<div class="buttons">
<button id="start">START</button>
<button id="pause">PAUSE</button>
<button id="stop">STOP</button>
<button id="reset">RESET</button>
</div>

<div id="log"></div>

</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

const $=id=>document.getElementById(id);

const demoBtn=$("demo");
const realBtn=$("real");

const logEl=$("log");
const priceEl=$("price");
const balanceEl=$("balance");
const modeEl=$("mode");
const statusEl=$("status");
const profitEl=$("profit");

const APP_ID="1089";
const SYMBOL="R_100";

/* STATE */
let ws;
let token;
let running=false;
let paused=false;
let mode="DEMO";

let digits=[];
let warmup=0;
let active=false;

let tradeLock=false;
let ladder=1;
let profit=0;

/* LOG */
function log(msg){
logEl.innerHTML+="<br>"+msg;
logEl.scrollTop=logEl.scrollHeight;
}

/* SEND */
function send(d){
if(ws && ws.readyState===1){
ws.send(JSON.stringify(d));
}
}

/* DIGIT ENGINE */
function lastDigit(p){
const s=p.toFixed(2);
return Number(s[s.length-1]);
}

/* STAKE (PRESERVED) */
function stake(){
if(ladder===1) return 0.35;
if(ladder===2) return 4.05;
return 46.8;
}

/* MODE SWITCH */
function setMode(m){

mode=m;
modeEl.textContent=m;

demoBtn.classList.remove("active");
realBtn.classList.remove("active");

if(m==="DEMO"){
demoBtn.classList.add("active");
}else{
realBtn.classList.add("active");
}

log("MODE → "+m);
connect(); // reconnect with correct token
}

/* CONNECT (FIXED PER ACCOUNT) */
function connect(){

if(ws) ws.close();

let t = mode==="DEMO"
? $("demoToken").value.trim()
: $("realToken").value.trim();

if(!t){
log("❌ Missing token for "+mode);
return;
}

token=t;

log("CONNECTING → "+mode);

ws=new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);

ws.onopen=()=>{
log("CONNECTED");
send({authorize:token});
};

ws.onmessage=(e)=>{

const msg=JSON.parse(e.data);

/* AUTH */
if(msg.msg_type==="authorize"){
log("AUTHORIZED → "+mode);

send({balance:1,subscribe:1});
send({ticks:SYMBOL,subscribe:1});
}

/* BALANCE */
if(msg.msg_type==="balance"){
balanceEl.textContent=Number(msg.balance.balance).toFixed(2);
}

/* TICK */
if(msg.msg_type==="tick"){

const price=msg.tick.quote;
const d=lastDigit(price);

priceEl.textContent=price.toFixed(2)+" → "+d;

/* warmup */
if(!active){
warmup++;
if(warmup>=10){
active=true;
statusEl.textContent="RUNNING";
log("BOT ACTIVE");
}
return;
}

/* digits */
digits.push(d);
if(digits.length>3) digits.shift();

/* signal */
if(digits.length===3){
if(digits[0]===digits[1]&&digits[1]===digits[2]&&!tradeLock){
trade(digits[2]);
}
}

}

/* RESULT */
if(msg.msg_type==="proposal_open_contract"){

const c=msg.proposal_open_contract;

if(c.is_sold){
const pnl=Number(c.profit);

profit+=pnl;
profitEl.textContent=profit.toFixed(2);

log("RESULT → "+pnl);

if(pnl>0) ladder=1;
else ladder=Math.min(ladder+1,3);

tradeLock=false;
}

}

};

}

/* TRADE */
function trade(barrier){

if(!running||paused||tradeLock) return;

tradeLock=true;

const amount=stake();

send({
buy:1,
price:amount,
parameters:{
amount,
basis:"stake",
contract_type:"DIGITDIFF",
currency:"USD",
duration:1,
duration_unit:"t",
symbol:SYMBOL,
barrier
}
});

log("TRADE "+mode+" → "+barrier);
}

/* BUTTONS */

$("start").onclick=()=>{
running=true;
connect();
};

$("pause").onclick=()=>paused=!paused;

$("stop").onclick=()=>{
running=false;
ws?.close();
statusEl.textContent="STOPPED";
};

$("reset").onclick=()=>{
location.reload();
};

demoBtn.onclick=()=>setMode("DEMO");
realBtn.onclick=()=>setMode("REAL");

});
</script>

</body>
  </html>
