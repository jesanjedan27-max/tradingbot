<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deriv Pro RSI Digit Bot (V108)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Deriv Pro RSI Digit Bot (V108)</h1>

  <input id="token" type="password" placeholder="Enter Deriv API Token">

  <div class="row">
    <input id="stake" type="number" step="0.01" value="0.35" placeholder="Stake">
    <input id="tp" type="number" value="20" placeholder="Take Profit">
    <input id="sl" type="number" value="10" placeholder="Stop Loss">
  </div>

  <div class="stats">
    <div>Balance: <span id="balance">--</span></div>
    <div>Price: <span id="price">--</span></div>
    <div>RSI: <span id="rsi">--</span></div>
    <div>Stake: <span id="currentStake">0.00</span></div>
    <div>Profit: <span id="profit">0.00</span></div>
    <div>Status: <span id="status">Stopped</span></div>
  </div>

  <div id="recoveryContainer">
    <div id="recoveryBar"></div>
  </div>

  <div class="buttons">
    <button id="start">START</button>
    <button id="pause">PAUSE</button>
    <button id="stop">STOP</button>
    <button id="reset">RESET</button>
  </div>

  <div class="logs">
    <div class="log-box">
      <h3>TRADE LOG</h3>
      <div id="log" class="log"></div>
    </div>
  </div>
</div>

<script src="bot.js"></script>
</body>
</html>
